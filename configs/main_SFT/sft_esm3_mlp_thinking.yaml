# @package _global_

# SFT experiment: ESM-3 + MLP Projector with Thinking Mode
# Same as sft_esm3_mlp_combined but with enable_thinking=True:
# - Training data includes <think>\n\n</think>\n\n before response
# - Loss is computed only on response tokens after </think>
# - At inference, model can fill <think> block with reasoning
#
# Usage: bash scripts/launch_train.sh main_SFT=sft_esm3_mlp_thinking

defaults:
  - override /model: qwen3_8b
  - override /encoder: esm3_small
  - override /data: combined_sft_260225
  - override /training: sft_lora

approach: esm3
experiment_name: mlp_combined_thinking_${model.name}_${now:%m%d_%H%M%S}

# Force MLP projector (default, but explicit for clarity)
encoder:
  encoder_batch_size: 4
  projector:
    type: mlp

# Cap protein length to avoid ESM-3 geometric attention OOM on long seqs
data:
  processing:
    max_protein_length: 1024
  enable_thinking: true

training:
  # Differential LR: projector trains from random init, needs higher LR
  lr: 2e-4
  projector_lr: 1e-3  # 5x base LR

  # Token-budget dynamic batching
  max_tokens_per_batch: 8192
  max_batch_size: 16
  gradient_accumulation_steps: 4
  eval_batch_size: 4

  freeze_lora_steps: 0

  epochs: 3
  max_seq_length: 2048

  save_steps: 250
  eval_steps: 250

  wandb:
    tags:
      - sft_lora
      - esm3_mlp
      - combined_sft
      - fsdp
      - thinking
      - ${model.name}

evaluation:
  name: sft_combined
