# Qwen3-8B Base model for SSL continued pre-training.
# Base (non-Instruct) variant — no chat template, pure causal LM.
name: qwen3_8b_base
path: Qwen/Qwen3-8B-Base
type: causal_lm

architecture:
  hidden_size: 4096
  num_attention_heads: 32
  num_key_value_heads: 8
  num_layers: 36
  vocab_size: 151936
  intermediate_size: 12288

generation:
  max_new_tokens: 512
  temperature: 0.7
  top_p: 0.9
  do_sample: true
