method: grpo

# GRPO-specific settings
grpo:
  group_size: 8          # Number of completions per prompt
  temperature: 0.9
  use_kl_penalty: false  # DAPO improvement
  normalize_advantages: false  # Dr. GRPO improvement
  focal_enabled: false   # Focal reward weighting for category imbalance
  focal_gamma: 2.0       # Focal exponent (only used when focal_enabled=true)
  binary_alignment: false  # Strict binary quality alignment (no partial 0.2 credit)
  classification_only: false  # Pure binary classification reward (correct category=1, wrong=0)

# Quantization (disabled for GRPO)
quantization:
  enabled: false

# Training parameters
lr: 5e-6
projector_lr: 2.5e-5  # 5x base LR for pooling+projector
epochs: 1
batch_size: 4
gradient_accumulation_steps: 4
max_seq_length: 2048
max_grad_norm: 1.0

# LoRA (same as SFT)
lora:
  r: 8
  alpha: 16
  dropout: 0.05
  target_modules:
    - q_proj
    - k_proj
    - v_proj
    - o_proj
    - gate_proj
    - up_proj
    - down_proj

# Rollout settings (generation during GRPO)
rollout:
  top_p: 0.95
  max_tokens: 512
  do_sample: true
  enable_thinking: true  # Allow <think>...</think> before <answer>. Qwen3 reasoning.

# Checkpointing
save_steps: 100
eval_steps: 50

# Logging
logging_steps: 10

# wandb settings (override global logging.wandb)
wandb:
  project: protein-llm-rl
  tags:
    - grpo
    - ${model.name}
    - mol_instructions
