# @package _global_

# GRPO ProteinLM Bench: ESM3+MLP SFT → GRPO
# Chains from ESM3+MLP SFT checkpoint. Tests multimodal RL on MC questions.
# Note: ProteinLMBench questions are text-only (no protein sequences),
# but the ESM3 approach is tested for consistency with the SFT model form.
#
# Memory budget (DDP, per GPU on 8×H100 80GB):
#   LLM (full replica): ~16 GB
#   ESM-3 (replicated): ~1.2 GB, projector: ~0.1 GB
#   Peak: ~25 GB → 55 GB headroom on H100 80GB
#
# Optimizations (2026-03-10):
#   - KV cache enabled during generation (model.eval() + use_cache=True)
#   - ESM-3 embeddings cached across log-prob recomputations
#   - Batched log-prob: all completions per prompt in one forward pass
#   - group_size=8: best throughput/stability from P1c scaling tests
#   - <answer> tags: model wraps answers in <answer>...</answer>, format reward +0.1
#   - enable_thinking=False: empty <think></think> prefix, no reasoning overhead
#
# Usage:
#   python scripts/train.py main_RL=grpo_proteinlm_mlp_sft

defaults:
  - override /model: qwen3_8b
  - override /encoder: esm3_small
  - override /data: proteinlm_bench
  - override /training: grpo

approach: esm3
experiment_name: grpo_proteinlm_mlp_sft_${model.name}_${now:%m%d_%H%M%S}

# Chain from ESM3+MLP SFT
parent_experiment: sft_esm3_mlp_combined_qwen3_8b_it_0306_010408

# Data task for reward routing
data:
  task: proteinlm_bench

training:
  # --- DDP on 8×H100 80GB (no FSDP) ---
  lr: 2e-6               # lower LR for fine-tuning already-trained model
  projector_lr: 1e-5     # 5x base LR, conservative for trained projector
  batch_size: 4
  gradient_accumulation_steps: 2  # effective batch = 4 * 8 GPUs * 2 = 64
  gradient_checkpointing: true
  epochs: 3
  warmup_steps: 10
  max_grad_norm: 1.0

  grpo:
    group_size: 8
    temperature: 0.9
    use_kl_penalty: false
    normalize_advantages: false

  rollout:
    max_tokens: 256  # Thinking mode: ~50 tokens think + ~20 tokens answer
    top_p: 0.95
    do_sample: true
    enable_thinking: true  # Let model reason before <answer>

  save_steps: 25
  eval_steps: 10
  logging_steps: 5

  fsdp:
    enabled: false  # DDP: full model on each GPU, KV cache works with grad ckpt toggle

  wandb:
    tags:
      - grpo
      - proteinlm_bench
      - mlp_sft
      - ${model.name}
