# @package _global_

# GRPO Structure Quality: ESM3+MLP SFT → GRPO (frozen MM + focal weighting)
# Same as grpo_structure_mlp_sft_frozen_mm but adds focal reward weighting
# to combat category imbalance (51% high, 45% medium, 3.5% low).
#
# Focal weight = (1 - category_freq)^gamma, normalized to mean 1.0:
#   gamma=2: high→0.239, medium→0.298, low→0.932 (before normalization)
#   After normalization: high→0.87, medium→1.09, low→3.40
#   Low-quality proteins get ~4x reward boost vs high-quality ones.
#
# Usage:
#   python scripts/train.py main_RL=grpo_structure_mlp_sft_frozen_mm_focal

defaults:
  - override /model: qwen3_8b
  - override /encoder: esm3_small
  - override /data: structure_quality
  - override /training: grpo

approach: esm3
experiment_name: grpo_structure_mlp_sft_frozen_mm_focal_${model.name}_${now:%m%d_%H%M%S}

# ESM-3 sub-batch: 4 fits comfortably
encoder:
  encoder_batch_size: 4

# Chain from ESM3+MLP SFT
parent_experiment: sft_esm3_mlp_combined_qwen3_8b_it_0306_010408

# Data task for reward routing
data:
  task: esmfold
  processing:
    max_protein_length: 512

training:
  # --- DDP on 8×H100 80GB (no FSDP) ---
  # batch_size=1 + grad_accum=8 to reduce peak GPU memory during
  # _compute_batched_log_probs (16 completions through LLM with grad).
  # Previous batch_size=2 left only ~4 GB headroom (77.7/81.6 GB)
  # and caused OOM → NCCL deadlock hang at step ~8.
  lr: 5e-6
  batch_size: 1
  gradient_accumulation_steps: 8  # effective batch = 1 * 8 GPUs * 8 = 64 (unchanged)
  gradient_checkpointing: true
  epochs: 1
  warmup_steps: 20
  max_grad_norm: 1.0

  # Freeze multimodal head: pooling + projector require_grad=False
  freeze_multimodal: true

  grpo:
    group_size: 16
    temperature: 0.9
    use_kl_penalty: false
    normalize_advantages: false
    focal_enabled: true
    focal_gamma: 2.0
    binary_alignment: true

  rollout:
    max_tokens: 512
    top_p: 0.95
    do_sample: true
    enable_thinking: false

  save_steps: 50
  eval_steps: 25
  logging_steps: 5

  fsdp:
    enabled: false

  wandb:
    tags:
      - grpo
      - structure_quality
      - mlp_sft
      - frozen_mm
      - focal
      - ${model.name}
