# @package _global_

# GRPO ProteinLM Bench: Text SFT → GRPO
# Chains from text-only SFT checkpoint. Tests RL refinement on MC questions.
#
# Memory budget (FSDP/4, per GPU):
#   Static: 4.6 GB (model + LoRA, no encoder)
#   Peak:   ~10 GB (generation + grad)  →  36 GB headroom on L40S 46GB
#
# Usage:
#   python scripts/train.py main_RL=grpo_proteinlm_text_sft

defaults:
  - override /model: qwen3_8b
  - override /data: proteinlm_bench
  - override /training: grpo

approach: text
experiment_name: grpo_proteinlm_text_sft_${model.name}_${now:%m%d_%H%M%S}

# Chain from text SFT
parent_experiment: sft_text_combined_qwen3_8b_it_0307_190324

# Data task for reward routing
data:
  task: proteinlm_bench

training:
  # --- Optimized for 4×L40S 46GB ---
  lr: 2e-6               # lower LR for fine-tuning already-trained model
  batch_size: 4
  gradient_accumulation_steps: 2  # effective batch = 32
  epochs: 3               # fewer epochs than base (already has protein knowledge)
  warmup_steps: 10
  max_grad_norm: 1.0

  grpo:
    group_size: 8
    temperature: 0.8
    use_kl_penalty: false
    normalize_advantages: false

  rollout:
    max_tokens: 64
    top_p: 0.95
    do_sample: true

  save_steps: 25
  eval_steps: 10
  logging_steps: 5

  fsdp:
    enabled: true

  wandb:
    tags:
      - grpo
      - proteinlm_bench
      - text_sft
      - ${model.name}
