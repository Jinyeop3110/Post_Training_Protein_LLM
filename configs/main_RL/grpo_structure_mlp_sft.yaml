# @package _global_

# GRPO Structure Quality: ESM3+MLP SFT → GRPO
# Chains from ESM3+MLP SFT checkpoint. Tests RL on top of multimodal SFT.
#
# Memory budget (DDP, per GPU on 8×H100 80GB):
#   Empirical: bs=2, gs=16 → ~52 GB (from scaling tests)
#   LLM (full replica): ~16 GB, ESM-3: ~1.2 GB, overhead: ~20 GB
#   Headroom: ~28 GB for activations/gradients
#
# Optimizations (2026-03-10):
#   - KV cache enabled during generation (model.eval() + use_cache=True)
#   - ESM-3 embeddings cached across log-prob recomputations
#   - Batched log-prob: all completions per prompt in one forward pass
#   - group_size=16: max diversity for GRPO advantage estimation
#   - encoder_batch_size=4: faster ESM-3 encoding (was 2)
#   - <answer> tags: format reward +0.1, reward extracted from tags
#   - enable_thinking=True: model generates <think>...</think> before <answer>
#
# Usage:
#   python scripts/train.py main_RL=grpo_structure_mlp_sft

defaults:
  - override /model: qwen3_8b
  - override /encoder: esm3_small
  - override /data: structure_quality
  - override /training: grpo

approach: esm3
experiment_name: grpo_structure_mlp_sft_${model.name}_${now:%m%d_%H%M%S}

# ESM-3 sub-batch: 4 fits comfortably (measured 28 GB at bs=2, gs=4)
encoder:
  encoder_batch_size: 4

# Chain from ESM3+MLP SFT
parent_experiment: sft_esm3_mlp_combined_qwen3_8b_it_0306_010408

# Data task for reward routing
data:
  task: esmfold
  processing:
    max_protein_length: 512  # ESM-3 geom_attention is O(L^2), OOMs on long seqs

training:
  # --- DDP on 8×H100 80GB (no FSDP) ---
  lr: 5e-6
  projector_lr: 2.5e-5   # 5x base LR: trained projector, conservative update
  batch_size: 2
  gradient_accumulation_steps: 4  # effective batch = 2 * 8 GPUs * 4 = 64
  gradient_checkpointing: true
  epochs: 1
  warmup_steps: 20
  max_grad_norm: 1.0

  grpo:
    group_size: 16
    temperature: 0.9
    use_kl_penalty: false
    normalize_advantages: false

  rollout:
    max_tokens: 512  # Thinking mode needs more tokens for <think>...</think>
    top_p: 0.95
    do_sample: true
    enable_thinking: false  # Reasoning induced via system prompt inside <answer> tags

  save_steps: 50
  eval_steps: 25
  logging_steps: 5

  fsdp:
    enabled: false  # DDP: full model on each GPU, KV cache works with grad ckpt toggle

  wandb:
    tags:
      - grpo
      - structure_quality
      - mlp_sft
      - ${model.name}
