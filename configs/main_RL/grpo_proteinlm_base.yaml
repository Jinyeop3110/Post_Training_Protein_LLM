# @package _global_

# GRPO ProteinLM Bench: Base Qwen3-8B (fresh LoRA, no SFT parent)
# Tests whether RL alone can learn MC protein knowledge.
# Small dataset (944 questions) — needs more epochs and careful tuning.
#
# Memory budget (DDP, per GPU on 8×H100 80GB):
#   LLM (full replica): ~16 GB, no encoder (text-only)
#   Peak: ~20 GB → 60 GB headroom on H100 80GB
#
# Optimizations (2026-03-10):
#   - KV cache enabled during generation (model.eval() + use_cache=True)
#   - Batched log-prob: all completions per prompt in one forward pass
#   - group_size=8: best throughput/stability from P1c scaling tests
#   - <answer> tags: model wraps answers in <answer>...</answer>, format reward +0.1
#   - enable_thinking=False: empty <think></think> prefix, no reasoning overhead
#
# Usage:
#   python scripts/train.py main_RL=grpo_proteinlm_base

defaults:
  - override /model: qwen3_8b
  - override /data: proteinlm_bench
  - override /training: grpo

approach: text
experiment_name: grpo_proteinlm_base_${model.name}_${now:%m%d_%H%M%S}

# No parent — fresh LoRA init
parent_experiment: null
parent_checkpoint: null

# Data task for reward routing
data:
  task: proteinlm_bench

training:
  # --- DDP on 8×H100 80GB (no FSDP) ---
  lr: 5e-6
  batch_size: 4
  gradient_accumulation_steps: 2  # effective batch = 4 * 8 GPUs * 2 = 64
  gradient_checkpointing: true
  epochs: 5               # small dataset (944 Qs), need more passes
  warmup_steps: 10
  max_grad_norm: 1.0

  grpo:
    group_size: 16        # 16 completions for diverse MC attempts
    temperature: 0.9
    use_kl_penalty: false
    normalize_advantages: false

  # MC answers are short
  rollout:
    max_tokens: 256       # Thinking mode: ~50 tokens think + ~20 tokens answer
    top_p: 0.95
    do_sample: true
    enable_thinking: true  # Let model reason before <answer>

  save_steps: 25
  eval_steps: 10
  logging_steps: 5

  fsdp:
    enabled: false  # DDP: full model on each GPU, KV cache works with grad ckpt toggle

  wandb:
    tags:
      - grpo
      - proteinlm_bench
      - base_model
      - ${model.name}
